name: Setup Node project
description: Install Node.js dependencies with npm cache
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: app/order-service/package-lock.json
    - shell: bash
      run: npm ci
      working-directory: app/order-service

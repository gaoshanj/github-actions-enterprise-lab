name: Basic CI - student

# TODO 1: Configure push to main, pull_request, and workflow_dispatch.
on:
  push:
    branches: []
  # Add the remaining events here.

permissions:
  # TODO 2: Allow checkout and repository reads only.
  contents: TODO_READ_PERMISSION

jobs:
  test:
    # TODO 3: Select the GitHub-hosted Ubuntu runner.
    runs-on: TODO_RUNNER
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - run: npm run lint
        working-directory: app/order-service
      - run: npm test
        working-directory: app/order-service
      - run: npm run build
        working-directory: app/order-service
      # TODO 4: Upload app/order-service/dist as order-service-dist.
      - uses: actions/upload-artifact@v4
        with:
          name: order-service-dist
          path: app/order-service/dist

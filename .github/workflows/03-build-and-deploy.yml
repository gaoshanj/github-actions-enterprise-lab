name: Build and deploy - student

# TODO 1: Configure push to main and workflow_dispatch.
on:
  # Add the required events here.

permissions:
  # Grant only contents: read.
  contents: TODO_READ_PERMISSION

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # TODO 2: Expose the tag generated by the meta step.
      image-tag: TODO_STEP_OUTPUT
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-project
      - run: npm test
        working-directory: app/order-service
      - run: docker build -t order-service:${{ steps.meta.outputs.tag }} app/order-service
      - run: docker save order-service:${{ steps.meta.outputs.tag }} -o order-service.tar
      - uses: actions/upload-artifact@v4
        with:
          name: order-service-image
          path: order-service.tar

  integration:
    # TODO 3: Make this job depend on build.
    needs: TODO_BUILD_NEED
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - run: |
          node -e "require('net').connect(6379, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
          npm test
        working-directory: app/order-service

  staging:
    # TODO 4: Require both build and integration, then attach the staging environment.
    needs: TODO_ALL_BUILD_NEEDS
    runs-on: ubuntu-latest
    environment: TODO_ENVIRONMENT
    steps:
      - run: |
          echo "Deploying image tag ${{ needs.build.outputs.image-tag }} to staging"
          echo "This training deployment is intentionally simulated."

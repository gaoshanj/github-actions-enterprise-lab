name: Matrix CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: app/order-service

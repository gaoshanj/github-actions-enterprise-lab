name: Self-hosted Runner Lab - student

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    # TODO 1: Require all six labels in the correct AND-matching list.
    runs-on: [TODO_RUNNER_LABELS]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
      - uses: ./.github/actions/setup-project
      - run: npm test
        working-directory: app/order-service
